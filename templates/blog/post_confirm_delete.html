{% extends "base.html" %}

{% block content %}

<h1 class="mb-4">Smazat příspěvek</h1>

<form method="post">
  {% csrf_token %}

</form>
<a class="btn btn-secondary" href="{% url 'home' %}">Zrušit</a>

{% endblock content %}
